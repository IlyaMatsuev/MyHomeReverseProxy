# Encoded characters in paths (%2F etc.) are allowed by default, which is fine: routers match on the host only
entryPoints:
  web:
    address: ":80"
    http:
      # Drops request headers like X_Forwarded_For that some backends read as X-Forwarded-For
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      tls: {}

certificatesResolvers:
  duckdns:
    acme:
      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        # Reads DUCKDNS_TOKEN from the environment
        provider: duckdns

providers:
  file:
    directory: /etc/traefik/config
    watch: true

api: {}

experimental:
  plugins:
    # Downloaded on start: https://github.com/Aetherinox/traefik-api-token-middleware
    api-token:
      moduleName: github.com/Aetherinox/traefik-api-token-middleware
      version: v0.1.4

log:
  # Default is ERROR. INFO also shows config reloads and certificate renewals
  level: INFO
  filePath: /etc/traefik/logs/traefik.log
  # Rotated by Traefik: at most 3 old files of 10 MB
  maxSize: 10
  maxBackups: 3

accessLog:
  # Traefik doesn't rotate it, "npm run traefik:logs:rotate" makes logrotate do it weekly
  filePath: /etc/traefik/logs/access.log
  # JSON, so every value comes with its name. All fields are kept, "npm run traefik:logs" shows the useful ones
  format: json
  fields:
    headers:
      # Headers are dropped by default, which keeps the tokens out of the log
      names:
        User-Agent: keep
