# Encoded characters in paths (%2F etc.) are allowed by default, which is fine: routers match on the host only
entryPoints:
  web:
    address: ":80"
    http:
      # Drops request headers like X_Forwarded_For that some backends read as X-Forwarded-For
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      tls: {}

certificatesResolvers:
  duckdns:
    acme:
      storage: /etc/traefik/acme/acme.json
      dnsChallenge:
        # Reads DUCKDNS_TOKEN from the environment
        provider: duckdns

providers:
  file:
    directory: /etc/traefik/config
    watch: true

api: {}

experimental:
  plugins:
    # Downloaded on start: https://github.com/Aetherinox/traefik-api-token-middleware
    api-token:
      moduleName: github.com/Aetherinox/traefik-api-token-middleware
      version: v0.1.4

log:
  # Default is ERROR. INFO also shows config reloads and certificate renewals
  level: INFO

accessLog:
  # JSON, so every value comes with its name
  format: json
  filters:
    # Everything except 404: bots scanning the IP for common paths get it from Traefik, no router matches them
    statusCodes: ["100-403", "405-599"]
  fields:
    # Only these fields. The headers are dropped too, which keeps the tokens out of the log
    defaultMode: drop
    names:
      ClientHost: keep
      RequestMethod: keep
      RequestPath: keep
      DownstreamStatus: keep
      RouterName: keep
