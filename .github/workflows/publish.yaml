name: Publish Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_NAME: reverse-proxy

# Secrets required for this action:
# 1. DOCKER_USERNAME - username of the docker account
# 2. DOCKER_ACCESS_TOKEN - docker personal access token used to log in into the registry

jobs:
  build-amd64:
    name: "Build linux/amd64"
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push AMD64 image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./
          platforms: linux/amd64
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

  build-arm64:
    name: "Build linux/arm64"
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push ARM64 image"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./
          platforms: linux/arm64
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=linux/arm64

  publish-image:
    name: "Publish multi-arch image"
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Create and push manifest"
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}@${{ needs.build-amd64.outputs.digest }} \
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}@${{ needs.build-arm64.outputs.digest }}
