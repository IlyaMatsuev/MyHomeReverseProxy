name: Publish Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"

# Secrets required for this action:
# 1. DOCKER_USERNAME - username of the docker account
# 2. DOCKER_ACCESS_TOKEN - docker personal access token used to log in into the registry

jobs:
  build-amd64:
    name: "Build AMD64 image"
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push the image"
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/reverse-proxy:amd64"
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    name: "Build ARM64 image"
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push the image"
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64/v8
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/reverse-proxy:arm64"
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  publish-image:
    name: "Publish the latest docker image version"
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: "Create and push manifest"
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKER_USERNAME }}/reverse-proxy:latest \
            ${{ secrets.DOCKER_USERNAME }}/reverse-proxy@${{ needs.build-amd64.outputs.digest }} \
            ${{ secrets.DOCKER_USERNAME }}/reverse-proxy@${{ needs.build-arm64.outputs.digest }}
