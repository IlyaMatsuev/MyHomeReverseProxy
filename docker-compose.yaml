# Docker keeps container logs forever by default. Rotate them instead: at most 3 files of 10 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    env_file: .env
    network_mode: host
    volumes:
      - ./traefik:/etc/traefik

  pihole:
    image: pihole/pihole
    container_name: pihole
    restart: unless-stopped
    logging: *logging
    env_file: ./pihole/.env
    ports:
      - "${PIHOLE_PORT_DNS:-53}:53/tcp"
      - "${PIHOLE_PORT_DNS:-53}:53/udp"
      - "${PIHOLE_PORT_HTTP:-8080}:8080/tcp"
      - "${PIHOLE_PORT_HTTPS:-8443}:8443/tcp"
    volumes:
      - ./pihole/data:/etc/pihole
      - ./pihole/dnsmasq.d:/etc/dnsmasq.d
