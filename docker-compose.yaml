services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./traefik:/etc/traefik

  pihole:
    image: pihole/pihole
    container_name: pihole
    restart: unless-stopped
    env_file: ./config/pihole/.env.pihole.prod
    ports:
      - "${PIHOLE_PORT_DNS:-53}:53/tcp"
      - "${PIHOLE_PORT_DNS:-53}:53/udp"
      - "${PIHOLE_PORT_HTTP:-8080}:8080/tcp"
      - "${PIHOLE_PORT_HTTPS:-8443}:8443/tcp"
    volumes:
      - ./config/pihole/data:/etc/pihole
      - ./config/pihole/dnsmasq.d:/etc/dnsmasq.d
